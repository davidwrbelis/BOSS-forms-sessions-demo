{% extends "base.html" %}

{% block content %}

<div class="card grid-container">
    <h2>Login</h2>
    <img src="{{ url_for('static', filename='boss_resized.png') }}"/>
</div>

 <div class="card">
     <!-- Display system flash alerts (e.g., "Invalid username or password") -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!--
      The action attribute points back to your Python /login route.
      The method attribute MUST be POST to send input securely.
    -->
    <form id="loginForm" action="{{ url_for('login') }}" method="POST" autocomplete="off">

        <!-- The name attributes (S'username' and 'password') match your Python request.form.get() names -->
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
            <hr>
        </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required >
        </div>

        <button type="submit">Log In</button>
    </form>

    <div class="register-link">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </div>
</div>
{% endblock %}
