{% extends "base.html" %}

{% block content %}

<div class="card grid-container" >
    <div>
        <a href="{{ url_for('cart') }}"   class="logout-btn">Cart</a>
        <a href="{{ url_for('logout') }}" class="logout-btn">Log Out</a>
        <h2>Welcome {{ current_user.username }}!</h2>
    </div>
    <div>
         <img src="{{ url_for('static', filename='boss_resized.png') }}"/>
    </div>

</div>

{% for product in l_product_string %}
<div class="card grid-container" >
    {% set pedal_image = product['image'] %}
    <img src="{{ url_for('static', filename=pedal_image) }}"/>
    <p>
        {{ product["description"] }}
    </p>
    <div>
        <p>${{ product["amount"] }}.00</p>

        <form action="{{ url_for('home') }}" method="POST">
           <label for="{{ product['key'] }}">Quantity:</label>
            <select name="{{ product['key'] }}" id="{{ product['key'] }}">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </div>
    <div>
            {{ product["output_str"] }}
    </div>
</div>
{% endfor %}

{% endblock %}
